[project]
name = "quantify"
version = "0.1.0"
description = "Personal quantitative research platform powered by Tushare + MySQL + LLM Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "tushare>=1.4.6",
    "SQLAlchemy>=2.0.30",
    "PyMySQL>=1.1.0",
    "cryptography>=42.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "typer>=0.12.0",
    "loguru>=0.7.2",
    "tenacity>=8.3.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "ipython>=8.24.0",
]
web = [
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "streamlit-ace>=0.1.1",
]

[project.scripts]
quantify = "quantify.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantify"]

[tool.ruff]
line-length = 110
target-version = "py311"
