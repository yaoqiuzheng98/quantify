[project]
name = "quantify"
version = "0.1.0"
description = "Personal quantitative research platform powered by Tushare + MySQL + LLM Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "tushare>=1.4.6",
    "SQLAlchemy>=2.0.30",
    "PyMySQL>=1.1.0",
    "cryptography>=42.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "typer>=0.12.0",
    "loguru>=0.7.2",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "ipython>=8.24.0",
]
web = [
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "streamlit-ace>=0.1.1",
]
mining = [
    "pyqlib>=0.9.5",
    "alphalens-reloaded>=0.4.3",
    "openai>=1.30.0",
    "scipy>=1.13.0",
]
ml = [
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "gplearn>=0.4.2",
]
dl = [
    "torch>=2.2.0",
]

[project.scripts]
quantify = "quantify.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantify"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# JoinQuant 策略脚本用 `from jqdata import *`：引擎注入的全局函数
# (set_benchmark/order_target_value/get_index_stocks/...) 对静态分析不可见；
# numpy/pandas 在 builtins 重绑之后导入(E402)亦是该写法的固有形态。
"strategies/*.py" = ["E402", "F403", "F405"]
